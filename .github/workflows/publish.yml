name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install global dsh closure
        run: npm install -g @deepseek-ai/dsh@alpha

      - name: Link dsh closure types
        run: node scripts/link-dsh-closure.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Gate the release on the same checks CI runs per push.
      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Stamp package.json to the tag version
        # The tag is the single source of truth for what gets published (the
        # dsh-tui-pi@1.1.0 flow). Small patches skip the version-bump commit —
        # push the fix, tag it, and the workflow rewrites package.json here
        # (--allow-same-version makes a matching version a no-op). main's
        # package.json may lag behind npm; the next deliberate bump
        # (`npm version minor|major`) starts from whatever main carries, and
        # the stamp keeps publishes tag-accurate.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm version "${TAG_VERSION}" --no-git-tag-version --allow-same-version
          echo "publishing @aiwayds/dsh-mcp-adapter@${TAG_VERSION} (tag ${GITHUB_REF_NAME})"
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
