name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily 03:39 UTC — catches upstream dsh alpha drift without hand-pinning.
    - cron: '39 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The shipped engines floor plus current LTS.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Typechecking imports @deepseek-ai/* from the global dsh closure via
      # scripts/link-dsh-closure.mjs. A pristine runner has none, so install
      # the public CLI first — it carries the closure the linker resolves.
      # The rolling @alpha dist-tag, never hand-pinned and never `latest`
      # (latest still points at the rc line this plugin dropped).
      - name: Install global dsh (rolling @alpha dist-tag)
        run: |
          DSH_VERSION="$(npm view @deepseek-ai/dsh@alpha version)"
          echo "dsh closure: ${DSH_VERSION}"
          npm install -g "@deepseek-ai/dsh@${DSH_VERSION}" --no-audit --no-fund

      - name: Link dsh closure types
        run: node scripts/link-dsh-closure.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      # dsh 的 profile/bundle 机器会转壳调用 pnpm 来初始化 scratch profile。
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Boot smoke (real dsh host, scratch profile)
        run: npm run smoke
